# nginx do frontend em container. Equivale ao Cloudflare Pages:
# - arquivos estáticos do build com os cabeçalhos de public/_headers
#   (sem HSTS/upgrade-insecure-requests, que não cabem em http://localhost);
# - /api/* repassado ao backend sem o prefixo, como functions/api/[[path]].ts.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Restauração de backup e importações: o backend aceita até 20 MB.
  client_max_body_size 21m;
  server_tokens off;

  location /api/ {
    proxy_pass http://backend:3100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Mesma limpeza do proxy do Cloudflare: o navegador não escolhe o IP.
    proxy_set_header X-Client-IP "";
    proxy_set_header X-Proxy-Secret "";
    proxy_read_timeout 90s;
  }

  # Arquivo de configuração do Cloudflare, não deve ser servido.
  location = /_headers { return 404; }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com https://*.gstatic.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # SPA: rotas do React caem no index.html.
    try_files $uri $uri/ /index.html;
  }
}
