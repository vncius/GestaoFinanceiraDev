# App completo em containers, apontando para o banco de produção (Atlas).
#
#   1. Preencha um arquivo de variáveis com os valores de produção (modelo em
#      .env.docker.example). Pode ficar fora do projeto.
#   2. docker compose --env-file CAMINHO/DO/ARQUIVO up -d --build
#      (ou exporte as variáveis no shell antes de `docker compose up`).
#   3. Abra http://localhost:8080 (ou a porta de APP_PORT).
#
# Todas as variáveis chegam por interpolação (${...}), então qualquer arquivo
# passado em --env-file ou variável do shell vale; as obrigatórias param o
# compose com erro se faltarem.
#
# Só o frontend (nginx) fica exposto, e só nesta máquina (127.0.0.1); o
# backend é alcançado pela rede interna do compose via /api.
name: gestao-financeira

services:
  backend:
    build: ./backend
    environment:
      MONGODB_URI: ${MONGODB_URI:?defina MONGODB_URI}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-gestao_financeira}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (o mesmo de produção)}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY (a mesma de produção)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      NODE_ENV: production
      PORT: "3100"
      CORS_ORIGIN: http://localhost:${APP_PORT:-8080}
      # Uma camada de proxy (o nginx) à frente do Express.
      TRUST_PROXY_HOPS: "1"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?defina GOOGLE_CLIENT_ID}
        VITE_LEGAL_CONTROLLER_NAME: ${VITE_LEGAL_CONTROLLER_NAME:-}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
